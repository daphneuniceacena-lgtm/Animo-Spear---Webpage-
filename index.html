<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMO SPEAR — Circuit Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      background: #0A1A0A; 
      color: #D4EED4;
      font-family: 'Roboto Mono', 'Courier New', monospace;
    }
    /* Custom PCB Tech Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0A1A0A; border-left: 1px solid rgba(200,134,10,0.25); }
    ::-webkit-scrollbar-thumb { background: rgba(200,134,10,0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(200,134,10,0.7); }
    
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useMemo } = React;

    /* ============================================================
       PCB THEME — ANIMO SPEAR
    ============================================================ */
    const C = {
      copper:      "#C8860A",
      copperBright:"#E8A020",
      copperDim:   "#8B5E0A",
      maskDark:    "#0A1A0A",
      maskMid:     "#0F2410",
      maskCard:    "#122014",
      maskCard2:   "#0D1A0F",
      silk:        "#D4EED4",
      silkDim:     "#7AAB7A",
      ledGreen:    "#22FF88",
      ledYellow:   "#FFD020",
      ledRed:      "#FF3838",
      ledBlue:     "#38AAFF",
      solder:      "#C8C8C8",
      solderDim:   "#888888",
      traceBd:     "rgba(200,134,10,0.25)",
      maskBd:      "rgba(34,255,136,0.15)",
      textBright:  "#E8F5E8",
      textMuted:   "#5A8A5A",
      white:       "#FFFFFF",
    };

    const FONT_MONO = "'Roboto Mono', 'Courier New', monospace";
    
    const glow   = (c) => `0 0 12px ${c}66, 0 0 28px ${c}22`;
    const traceG = (c) => `0 0 6px ${c}88, 0 0 16px ${c}33`;

    /* ============================================================
       DATA
    ============================================================ */
    const NOW = Date.now();
    const DAY = 86400000;

    const PART_STATUSES   = ["Available","Low Stock","Out of Stock","Ordered"];
    const TASK_STATUSES   = ["To Do","In Progress","Review","Done"];
    const TASK_PRIORITIES = ["Critical","High","Medium","Low"];
    const COMP_STATUSES   = ["Upcoming","Ongoing","Completed"];
    const MEMBER_ROLES    = ["Commander","Flight Director","Mission Specialist","Payload Specialist","Systems Engineer","Navigation Officer","Ground Control","Pilot"];

    const defaultParts = [
      { id:1, name:"NEMA 17 Stepper Motor",    category:"Actuators",      qty:6,  min:4, loc:"Shelf A1", status:"Available",    notes:"1.8°/step, 1.7A" },
      { id:2, name:"ESP32-WROOM-32",           category:"Microcontroller", qty:3,  min:5, loc:"Shelf A2", status:"Low Stock",   notes:"Dual-core WiFi BT" },
      { id:3, name:"TB6600 Stepper Driver",    category:"Drivers",         qty:8,  min:3, loc:"Cabinet B", status:"Available",   notes:"4A max current" },
      { id:4, name:"LiPo 3S 2200mAh",          category:"Power",           qty:0,  min:4, loc:"Shelf C1", status:"Out of Stock", notes:"On order ETA 1wk" },
      { id:5, name:"MPU6050 IMU Sensor",       category:"Sensors",         qty:10, min:3, loc:"Drawer D", status:"Available",    notes:"6-axis gyro+accel" },
      { id:6, name:"20x20mm Aluminum Profile", category:"Structure",       qty:12, min:6, loc:"Rack E",  status:"Available",    notes:"2040 V-slot series" },
    ];

    const defaultMembers = [
      { id:1,  name:"Amir Zabihi",      role:"Commander",          subteam:"President",                      active:true },
      { id:2,  name:"Lana Fajayo",      role:"Flight Director",    subteam:"Vice President & PRO",           active:true },
      { id:3,  name:"Andrea Escamilla", role:"Mission Specialist", subteam:"VP of Creatives & Marketing",    active:true },
      { id:4,  name:"Mikoh Filoteo",    role:"Payload Specialist", subteam:"VP of Finance & Business",       active:true },
      { id:5,  name:"Denielle Medina",  role:"Navigation Officer", subteam:"Secretary",                      active:true },
      { id:6,  name:"Daphne Acena",     role:"Pilot",              subteam:"Robotics Captain & Research Head", active:true },
      { id:7,  name:"Matt Pacifico",    role:"Systems Engineer",   subteam:"Software Head",                  active:true },
      { id:8,  name:"Aldus Plaus",      role:"Ground Control",     subteam:"Projects Head",                  active:true },
      { id:9,  name:"Jaiden Olasiman",  role:"Mission Specialist", subteam:"Hardware Head",                  active:true },
      { id:10, name:"Prince Sadia",     role:"Navigation Officer", subteam:"Trainings Head",                 active:true },
    ];

    const defaultTasks = [
      { id:1, title:"PCB Layout v2.0",        desc:"Finalize KiCAD layout for main controller",   assignee:"Matt Pacifico",   due:NOW+DAY*3, priority:"Critical", status:"In Progress", cat:"Hardware" },
      { id:2, title:"ROS2 Navigation Stack",  desc:"Implement SLAM + autonomous path planning",   assignee:"Daphne Acena",    due:NOW+DAY*7, priority:"High",     status:"To Do",       cat:"Software" },
      { id:3, title:"Restock stepper drivers",desc:"Order TB6600 x10 units from supplier",        assignee:"Mikoh Filoteo",   due:NOW+DAY*2, priority:"High",     status:"To Do",       cat:"Inventory" },
      { id:4, title:"Sponsor proposal deck",  desc:"TechCorp sponsorship presentation",           assignee:"Andrea Escamilla",due:NOW+DAY*5, priority:"Medium",   status:"Review",      cat:"Business" },
    ];

    const defaultComps = [
      { id:1, name:"RoboCon PH 2026",  loc:"Manila, PH",     date:NOW+DAY*20, ranking:null, score:null, notes:"National robotics championship",  status:"Upcoming" },
      { id:2, name:"STEM Fair DLSU-D", loc:"Dasmariñas, PH", date:NOW-DAY*30, ranking:1,    score:92,   notes:"1st place autonomous challenge",  status:"Completed" },
    ];

    const defaultBudget = [
      { id:1, title:"DLSU-D STEM Grant",         amount:25000, cat:"Grant",       type:"Income",  date:NOW-DAY*60, notes:"Annual robotics allocation" },
      { id:2, title:"Sponsor — CircuitWorks",    amount:12000, cat:"Sponsorship", type:"Income",  date:NOW-DAY*20, notes:"PCB fabrication sponsor" },
      { id:3, title:"Stepper Motors + Drivers",  amount:6800,  cat:"Components",  type:"Expense", date:NOW-DAY*10, notes:"NEMA17 + TB6600 batch" },
      { id:4, title:"RoboCon Registration",      amount:2500,  cat:"Competition", type:"Expense", date:NOW-DAY*5,  notes:"Team of 8 members" },
      { id:5, title:"FR4 PCB Fabrication",       amount:1800,  cat:"Fabrication", type:"Expense", date:NOW,        notes:"5-layer, 10 boards" },
    ];

    /* ============================================================
       HELPERS
    ============================================================ */
    const money  = (n) => new Intl.NumberFormat("en-PH").format(Math.round(Math.abs(n)));
    const fdate  = (ts) => new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    const finput = (ts) => new Date(ts).toISOString().split("T")[0];
    const uid    = () => Date.now() + Math.random();

    const statusClr = (s) => ({ Available:C.ledGreen,"Low Stock":C.ledYellow,"Out of Stock":C.ledRed,Ordered:C.ledBlue }[s] || C.silkDim);
    const prioClr   = (p) => ({ Critical:C.ledRed,High:C.ledYellow,Medium:C.ledGreen,Low:C.silkDim }[p] || C.silkDim);
    const colClr    = (s) => ({ "To Do":C.silkDim,"In Progress":C.ledYellow,Review:C.ledBlue,Done:C.ledGreen }[s] || C.silkDim);
    const compClr   = (s) => ({ Upcoming:C.ledYellow,Ongoing:C.ledGreen,Completed:C.solder }[s] || C.silkDim);

    const avatarPalette = [C.copper, C.ledGreen, C.ledBlue, C.ledYellow, C.solder, C.copperBright];

    /* ============================================================
       PCB BACKGROUND
    ============================================================ */
    const PCBBackground = () => {
      const traces = useMemo(() => {
        const arr = [];
        for (let i = 0; i < 18; i++) { arr.push({ x1: 0, y1: (i * 5.8 + 2), x2: 100, y2: (i * 5.8 + 2), w: i % 3 === 0 ? 0.08 : 0.04, op: i % 4 === 0 ? 0.35 : 0.18 }); }
        for (let i = 0; i < 22; i++) { arr.push({ x1: (i * 4.8 + 1), y1: 0, x2: (i * 4.8 + 1), y2: 100, w: i % 3 === 0 ? 0.06 : 0.03, op: i % 5 === 0 ? 0.3 : 0.15 }); }
        for (let i = 0; i < 8; i++) { const x = (i * 14 + 5); arr.push({ x1: x, y1: 0, x2: x + 20, y2: 30, w: 0.05, op: 0.2 }); }
        return arr;
      }, []);

      const vias = useMemo(() => Array.from({ length: 60 }, (_, i) => ({
        x: ((i * 137 + 31) % 100), y: ((i * 89 + 17) % 100), r: i % 5 === 0 ? 0.55 : i % 3 === 0 ? 0.38 : 0.22,
        o: i % 4 === 0 ? 0.7 : 0.35, isCopper: i % 7 === 0,
      })), []);

      const pads = useMemo(() => Array.from({ length: 20 }, (_, i) => ({ x: ((i * 233 + 50) % 95) + 2, y: ((i * 167 + 25) % 90) + 5, o: 0.18 })), []);

      return (
        <svg style={{ position: "fixed", inset: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 0 }} preserveAspectRatio="xMidYMid slice" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="pcbGlow1" cx="85%" cy="10%" r="45%">
              <stop offset="0%" stopColor={C.copper} stopOpacity="0.06" />
              <stop offset="100%" stopColor="transparent" stopOpacity="0" />
            </radialGradient>
            <radialGradient id="pcbGlow2" cx="10%" cy="85%" r="40%">
              <stop offset="0%" stopColor={C.ledGreen} stopOpacity="0.04" />
              <stop offset="100%" stopColor="transparent" stopOpacity="0" />
            </radialGradient>
            <filter id="traceBlur"><feGaussianBlur stdDeviation="0.1" /></filter>
          </defs>
          <rect width="100" height="100" fill="url(#pcbGlow1)" />
          <rect width="100" height="100" fill="url(#pcbGlow2)" />
          {traces.map((t, i) => <line key={`t-${i}`} x1={t.x1+"%"} y1={t.y1+"%"} x2={t.x2+"%"} y2={t.y2+"%"} stroke={C.copper} strokeWidth={t.w+"%"} opacity={t.op} filter="url(#traceBlur)" />)}
          {vias.map((v, i) => (
            <g key={`v-${i}`}>
              <circle cx={v.x+"%"} cy={v.y+"%"} r={v.r+"%"} fill="none" stroke={v.isCopper ? C.copper : C.solder} strokeWidth="0.08%" opacity={v.o} />
              <circle cx={v.x+"%"} cy={v.y+"%"} r={(v.r * 0.45)+"%"} fill={v.isCopper ? C.copper : C.solder} opacity={v.o * 0.6} />
            </g>
          ))}
          {pads.map((p, i) => <rect key={`p-${i}`} x={(p.x - 0.6)+"%"} y={(p.y - 0.25)+"%"} width="1.2%" height="0.5%" rx="0.1%" fill={C.copper} opacity={p.o} />)}
        </svg>
      );
    };

    /* ============================================================
       ATOMS
    ============================================================ */
    const Badge = ({ text, color, sm }) => (
      <span style={{
        fontFamily: FONT_MONO, fontWeight: 700, fontSize: sm ? 9 : 10,
        color: color || C.ledGreen,
        padding: sm ? "1px 7px" : "3px 10px", borderRadius: 3,
        background: (color || C.ledGreen) + "18", border: `1px solid ${color || C.ledGreen}55`,
        boxShadow: traceG(color || C.ledGreen), whiteSpace: "nowrap", letterSpacing: 0.8, textTransform: "uppercase",
      }}>{text}</span>
    );

    const Btn = ({ label, onClick, color, outline, sm, disabled, icon }) => {
      const clr = color || C.ledGreen;
      return (
        <button onClick={onClick} disabled={disabled} style={{
          display: "inline-flex", alignItems: "center", gap: 6,
          padding: sm ? "6px 14px" : "9px 20px",
          background: outline ? "transparent" : disabled ? "#0d1a0d" : clr,
          color: outline ? clr : disabled ? C.silkDim : C.maskDark,
          border: `1.5px solid ${disabled ? "#1a2a1a" : clr}`,
          borderRadius: 4, fontFamily: FONT_MONO, fontWeight: 700,
          fontSize: sm ? 10 : 12, cursor: disabled ? "not-allowed" : "pointer",
          transition: "all 0.15s", boxShadow: outline || disabled ? "none" : glow(clr),
          letterSpacing: 1, textTransform: "uppercase",
        }}>
          {icon && <span style={{ fontSize: 13 }}>{icon}</span>}{label}
        </button>
      );
    };

    const IconBtn = ({ icon, onClick, color, title }) => {
      const clr = color || C.ledGreen;
      return (
        <button onClick={onClick} title={title} style={{
          width: 28, height: 28, borderRadius: 3, border: `1px solid ${clr}55`,
          background: clr + "14", color: clr, fontFamily: FONT_MONO, fontSize: 11, fontWeight: 900,
          cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.15s",
        }}>{icon}</button>
      );
    };

    const QtyControl = ({ value, onChange }) => (
      <div style={{ display: "flex", alignItems: "center", gap: 5, padding: "3px 8px", background: C.maskCard2, borderRadius: 4, border: "1px solid " + C.traceBd }}>
        <IconBtn icon="−" onClick={() => onChange(Math.max(0, value - 1))} color={C.ledRed} title="Dec" />
        <span style={{ color: C.silk, fontFamily: FONT_MONO, fontWeight: 900, fontSize: 13, minWidth: 26, textAlign: "center" }}>{value}</span>
        <IconBtn icon="+" onClick={() => onChange(value + 1)} color={C.ledGreen} title="Inc" />
      </div>
    );

    const HRule = () => <div style={{ height: 1, background: `linear-gradient(90deg, transparent, ${C.copper}44, ${C.copper}66, ${C.copper}44, transparent)`, margin: "6px 0" }} />;

    const Card = ({ children, style, glowColor }) => (
      <div style={{
        background: C.maskCard, borderRadius: 6,
        border: `1px solid ${glowColor ? glowColor + "44" : C.maskBd}`,
        boxShadow: glowColor ? `0 0 20px ${glowColor}0A, inset 0 1px 0 ${glowColor}11` : `inset 0 1px 0 ${C.copper}0A`,
        position: "relative", overflow: "hidden", ...(style || {}),
      }}>
        <div style={{ position: "absolute", top: 4, left: 4, width: 8, height: 8, borderTop: `1px solid ${C.copper}33`, borderLeft: `1px solid ${C.copper}33`, pointerEvents: "none" }} />
        <div style={{ position: "absolute", top: 4, right: 4, width: 8, height: 8, borderTop: `1px solid ${C.copper}33`, borderRight: `1px solid ${C.copper}33`, pointerEvents: "none" }} />
        <div style={{ position: "absolute", bottom: 4, left: 4, width: 8, height: 8, borderBottom: `1px solid ${C.copper}33`, borderLeft: `1px solid ${C.copper}33`, pointerEvents: "none" }} />
        <div style={{ position: "absolute", bottom: 4, right: 4, width: 8, height: 8, borderBottom: `1px solid ${C.copper}33`, borderRight: `1px solid ${C.copper}33`, pointerEvents: "none" }} />
        {children}
      </div>
    );

    const SectionTitle = ({ text, color, rightElement }) => {
      const clr = color || C.ledGreen;
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 0 }}>
            <div style={{ width: 14, height: 1.5, background: clr, opacity: 0.6 }} />
            <div style={{ width: 7, height: 7, borderRadius: "50%", background: clr, boxShadow: glow(clr), border: `1.5px solid ${clr}` }} />
            <div style={{ width: 6, height: 1.5, background: clr, opacity: 0.6 }} />
          </div>
          <span style={{ color: clr, fontFamily: FONT_MONO, fontWeight: 900, fontSize: 11, letterSpacing: 3, textTransform: "uppercase", whiteSpace: "nowrap" }}>{text}</span>
          <div style={{ flex: 1, height: 1, background: `linear-gradient(90deg, ${clr}33, transparent)` }} />
          {rightElement && <div>{rightElement}</div>}
        </div>
      );
    };

    /* ============================================================
       MODAL + FORM FIELDS
    ============================================================ */
    const Modal = ({ title, onClose, children }) => (
      <div style={{
        position: "fixed", inset: 0, background: "rgba(0,0,0,0.88)", zIndex: 9999,
        display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(6px)",
      }} onClick={onClose}>
        <div style={{
          background: C.maskCard, border: `1px solid ${C.copper}55`, borderRadius: 8,
          padding: 28, width: "90%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto",
          boxShadow: `0 0 60px ${C.copper}18, 0 0 120px rgba(0,0,0,0.8)`, position: "relative",
        }} onClick={(e) => e.stopPropagation()}>
          {["top-left","top-right","bottom-left","bottom-right"].map((pos,i) => {
            const [v,h] = pos.split("-");
            return <div key={i} style={{ position:"absolute", [v]: 8, [h]: 8, width:12, height:12, [`border${v.charAt(0).toUpperCase()+v.slice(1)}`]: `2px solid ${C.copper}88`, [`border${h.charAt(0).toUpperCase()+h.slice(1)}`]: `2px solid ${C.copper}88`, pointerEvents:"none" }}/>
          })}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: C.copper, boxShadow: glow(C.copper) }} />
              <span style={{ color: C.copper, fontFamily: FONT_MONO, fontWeight: 900, fontSize: 12, letterSpacing: 2 }}>{title}</span>
            </div>
            <button onClick={onClose} style={{
              background: C.maskCard2, border: `1px solid ${C.traceBd}`, color: C.silkDim, width: 28, height: 28, borderRadius: 4,
              cursor: "pointer", fontSize: 14, fontFamily: FONT_MONO, fontWeight: 700,
            }}>×</button>
          </div>
          {children}
        </div>
      </div>
    );

    const Field = ({ label, value, onChange, type, placeholder }) => (
      <div style={{ marginBottom: 13 }}>
        <label style={{ display: "block", color: C.copper, fontFamily: FONT_MONO, fontSize: 9, fontWeight: 700, marginBottom: 5, letterSpacing: 2 }}>{label}</label>
        <input
          type={type || "text"} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder || ""}
          style={{
            width: "100%", boxSizing: "border-box", background: C.maskDark, border: `1px solid ${C.traceBd}`, borderRadius: 4, padding: "9px 12px",
            color: C.silk, fontFamily: FONT_MONO, fontSize: 11, outline: "none", letterSpacing: 0.5,
          }}
          onFocus={(e) => { e.target.style.borderColor = C.copper + "88"; e.target.style.boxShadow = traceG(C.copper); }}
          onBlur={(e) => { e.target.style.borderColor = C.traceBd; e.target.style.boxShadow = "none"; }}
        />
      </div>
    );

    const SelField = ({ label, value, onChange, options }) => (
      <div style={{ marginBottom: 13 }}>
        <label style={{ display: "block", color: C.copper, fontFamily: FONT_MONO, fontSize: 9, fontWeight: 700, marginBottom: 5, letterSpacing: 2 }}>{label}</label>
        <select value={value} onChange={(e) => onChange(e.target.value)} style={{
          width: "100%", background: C.maskDark, border: `1px solid ${C.traceBd}`, borderRadius: 4, padding: "9px 12px", color: C.silk, fontFamily: FONT_MONO, fontSize: 11, outline: "none",
        }}>
          {options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    );

    const SegControl = ({ label, value, onChange, options, colors }) => (
      <div style={{ marginBottom: 13 }}>
        {label && <label style={{ display: "block", color: C.copper, fontFamily: FONT_MONO, fontSize: 9, fontWeight: 700, marginBottom: 6, letterSpacing: 2 }}>{label}</label>}
        <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
          {options.map((o) => {
            const sel = value === o;
            const clr = (colors && colors[o]) || C.ledGreen;
            return (
              <div key={o} onClick={() => onChange(o)} style={{
                padding: "5px 12px", borderRadius: 3, cursor: "pointer", background: sel ? clr + "22" : "transparent",
                border: `1px solid ${sel ? clr : C.traceBd}`, color: sel ? clr : C.silkDim,
                fontFamily: FONT_MONO, fontWeight: 700, fontSize: 9, transition: "all 0.15s", letterSpacing: 0.8, boxShadow: sel ? traceG(clr) : "none",
              }}>{o}</div>
            );
          })}
        </div>
      </div>
    );

    const SaveBtn = ({ onClick, disabled, label }) => (
      <button onClick={onClick} disabled={disabled} style={{
        width: "100%", marginTop: 8, padding: "11px", background: disabled ? "#0a150a" : C.copper, color: disabled ? C.silkDim : C.maskDark,
        border: "none", borderRadius: 4, fontFamily: FONT_MONO, fontWeight: 900, fontSize: 12, cursor: disabled ? "not-allowed" : "pointer",
        letterSpacing: 2, textTransform: "uppercase", boxShadow: disabled ? "none" : glow(C.copper), transition: "all 0.2s",
      }}>{label || "SAVE"}</button>
    );

    /* ============================================================
       SIDEBAR
    ============================================================ */
    const NAV = [
      { id: "dashboard",    label: "Dashboard",    icon: "⊞", ref: "U1" },
      { id: "inventory",    label: "Inventory",    icon: "≡", ref: "U2" },
      { id: "members",      label: "Members",      icon: "⊕", ref: "U3" },
      { id: "tasks",        label: "Tasks",        icon: "⊟", ref: "U4" },
      { id: "competitions", label: "Competitions", icon: "◈", ref: "U5" },
      { id: "budget",       label: "Budget",       icon: "⊠", ref: "U6" },
    ];

    const Sidebar = ({ active, setActive, alertCount }) => (
      <aside style={{
        width: 230, minHeight: "100vh", background: `linear-gradient(180deg, ${C.maskDark} 0%, ${C.maskMid} 100%)`, borderRight: `2px solid ${C.copper}55`,
        display: "flex", flexDirection: "column", flexShrink: 0, position: "sticky", top: 0, height: "100vh", overflow: "auto",
        boxShadow: `4px 0 24px rgba(0,0,0,0.5), inset -1px 0 0 ${C.copper}22`,
      }}>
        <div style={{ padding: "24px 20px 18px", textAlign: "center", position: "relative" }}>
          <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 40, height: 8, background: C.maskDark, borderRadius: "0 0 20px 20px", border: `1px solid ${C.copper}44`, borderTop: "none" }} />
          <div style={{
            width: 80, height: 80, margin: "0 auto 14px", background: `linear-gradient(145deg, ${C.maskCard} 0%, ${C.maskCard2} 100%)`,
            border: `2px solid ${C.copper}77`, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center",

      return (
        <div style={{ padding: 28 }}>
          <SectionTitle text="Financial Log" color={C.ledGreen} rightElement={<Btn label="Log Transaction" sm color={C.ledGreen} onClick={() => setEditTrx({ title:"", amount:0, cat:"Misc", type:"Expense", date:NOW, notes:"" })} />} />
          
          <div style={{ display: "flex", gap: 16, marginBottom: 20 }}>
            <Card style={{ flex: 1, padding: 16, textAlign: "center" }} glowColor={C.ledBlue}>
              <div style={{ color: C.silkDim, fontSize: 10, letterSpacing: 1, marginBottom: 4 }}>TOTAL FUNDING</div>
              <div style={{ color: C.ledBlue, fontSize: 24, fontWeight: 900 }}>₱{money(income)}</div>
            </Card>
            <Card style={{ flex: 1, padding: 16, textAlign: "center" }} glowColor={C.ledRed}>
              <div style={{ color: C.silkDim, fontSize: 10, letterSpacing: 1, marginBottom: 4 }}>TOTAL EXPENSES</div>
              <div style={{ color: C.ledRed, fontSize: 24, fontWeight: 900 }}>₱{money(expense)}</div>
            </Card>
            <Card style={{ flex: 1, padding: 16, textAlign: "center" }} glowColor={balance >= 0 ? C.ledGreen : C.ledRed}>
              <div style={{ color: C.silkDim, fontSize: 10, letterSpacing: 1, marginBottom: 4 }}>CURRENT BALANCE</div>
              <div style={{ color: balance >= 0 ? C.ledGreen : C.ledRed, fontSize: 24, fontWeight: 900 }}>₱{money(balance)}</div>
            </Card>
          </div>

          <Card>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11, textAlign: "left" }}>
              <thead>
                <tr style={{ background: C.maskCard2, borderBottom: `1px solid ${C.traceBd}`, color: C.copper }}>
                  <th style={{ padding: "12px 16px" }}>DATE</th>
                  <th style={{ padding: "12px 16px" }}>DESCRIPTION</th>
                  <th style={{ padding: "12px 16px" }}>CATEGORY</th>
                  <th style={{ padding: "12px 16px", textAlign: "right" }}>AMOUNT</th>
                  <th style={{ padding: "12px 16px", width: 40 }}>ACT</th>
                </tr>
              </thead>
              <tbody>
                {budget.sort((a,b) => b.date - a.date).map(b => (
                  <tr key={b.id} style={{ borderBottom: `1px solid ${C.traceBd}` }}>
                    <td style={{ padding: "12px 16px", color: C.silkDim }}>{fdate(b.date)}</td>
                    <td style={{ padding: "12px 16px", color: C.silk, fontWeight: 700 }}>{b.title}<div style={{fontSize:9, color:C.silkDim, marginTop:4}}>{b.notes}</div></td>
                    <td style={{ padding: "12px 16px" }}><Badge text={b.cat} color={C.silkDim} sm /></td>
                    <td style={{ padding: "12px 16px", textAlign: "right", color: b.type === "Income" ? C.ledGreen : C.ledRed, fontWeight: 900 }}>
                      {b.type === "Income" ? "+" : "-"}₱{money(b.amount)}
                    </td>
                    <td style={{ padding: "12px 16px" }}><IconBtn icon="✎" onClick={() => setEditTrx(b)} color={C.copper} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>

          {editTrx && (
            <Modal title={editTrx.id ? "EDIT TRANSACTION" : "LOG TRANSACTION"} onClose={() => setEditTrx(null)}>
              <SegControl label="TYPE" value={editTrx.type} onChange={(v) => setEditTrx({...editTrx, type:v})} options={["Income", "Expense"]} colors={{Income:C.ledGreen, Expense:C.ledRed}} />
              <Field label="DESCRIPTION" value={editTrx.title} onChange={(v) => setEditTrx({...editTrx, title:v})} />
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="AMOUNT (₱)" type="number" value={editTrx.amount} onChange={(v) => setEditTrx({...editTrx, amount: parseFloat(v) || 0})} />
                <Field label="DATE" type="date" value={finput(editTrx.date)} onChange={(v) => setEditTrx({...editTrx, date: new Date(v).getTime()})} />
              </div>
              <SelField label="CATEGORY" value={editTrx.cat} onChange={(v) => setEditTrx({...editTrx, cat:v})} options={["Components", "Fabrication", "Competition", "Tools", "Grant", "Sponsorship", "Misc"]} />
              <Field label="NOTES" value={editTrx.notes} onChange={(v) => setEditTrx({...editTrx, notes:v})} />
              <SaveBtn onClick={handleSave} disabled={!editTrx.title || !editTrx.amount} />
            </Modal>
          )}
        </div>
      );
    };

    const Competitions = ({ store }) => {
      const { comps, setComps } = store;
      const [editComp, setEditComp] = useState(null);

      const handleSave = () => {
        if (!editComp.name) return;
        if (editComp.id) {
          setComps(comps.map(c => c.id === editComp.id ? editComp : c));
        } else {
          setComps([...comps, { ...editComp, id: uid() }]);
        }
        setEditComp(null);
      };

      return (
        <div style={{ padding: 28 }}>
          <SectionTitle text="Event Log" color={C.solder} rightElement={<Btn label="Add Event" sm color={C.solder} onClick={() => setEditComp({ name:"", loc:"", date:NOW, ranking:null, score:null, notes:"", status:"Upcoming" })} />} />
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {comps.sort((a,b) => b.date - a.date).map(c => (
              <Card key={c.id} style={{ padding: 20 }} glowColor={compClr(c.status)}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                      <span style={{ fontSize: 18, color: C.silk, fontWeight: 900 }}>{c.name}</span>
                      <Badge text={c.status} color={compClr(c.status)} sm />
                    </div>
                    <div style={{ color: C.silkDim, fontSize: 11, marginBottom: 4 }}>📍 {c.loc} • 📅 {fdate(c.date)}</div>
                    <div style={{ color: C.copper, fontSize: 10 }}>{c.notes}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <IconBtn icon="✎" onClick={() => setEditComp(c)} color={C.solderDim} />
                    {c.ranking && (
                      <div style={{ marginTop: 10, background: C.maskDark, padding: "8px 12px", borderRadius: 4, border: `1px solid ${C.traceBd}`, textAlign: "center" }}>
                        <div style={{ color: C.silkDim, fontSize: 8, letterSpacing: 1 }}>RANKING</div>
                        <div style={{ color: C.copperBright, fontSize: 20, fontWeight: 900 }}>#{c.ranking}</div>
                      </div>
                    )}
                  </div>
                </div>
              </Card>
            ))}
          </div>

          {editComp && (
            <Modal title={editComp.id ? "EDIT EVENT" : "ADD EVENT"} onClose={() => setEditComp(null)}>
              <Field label="EVENT NAME" value={editComp.name} onChange={(v) => setEditComp({...editComp, name:v})} />
              <Field label="LOCATION" value={editComp.loc} onChange={(v) => setEditComp({...editComp, loc:v})} />
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="DATE" type="date" value={finput(editComp.date)} onChange={(v) => setEditComp({...editComp, date: new Date(v).getTime()})} />
                <SegControl label="STATUS" value={editComp.status} onChange={(v) => setEditComp({...editComp, status:v})} options={COMP_STATUSES} colors={{Upcoming:C.ledYellow, Ongoing:C.ledGreen, Completed:C.solder}} />
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <Field label="RANKING (If completed)" type="number" value={editComp.ranking || ""} onChange={(v) => setEditComp({...editComp, ranking: parseInt(v) || null})} />
                <Field label="SCORE (If completed)" type="number" value={editComp.score || ""} onChange={(v) => setEditComp({...editComp, score: parseInt(v) || null})} />
              </div>
              <Field label="NOTES" value={editComp.notes} onChange={(v) => setEditComp({...editComp, notes:v})} />
              <SaveBtn onClick={handleSave} disabled={!editComp.name} />
            </Modal>
          )}
        </div>
      );
    };

    /* ============================================================
       APP CONTAINER
    ============================================================ */
    const App = () => {
      const [active, setActive] = useState("dashboard");
      const [parts, setParts] = useState(defaultParts);
      const [members, setMembers] = useState(defaultMembers);
      const [tasks, setTasks] = useState(defaultTasks);
      const [comps, setComps] = useState(defaultComps);
      const [budget, setBudget] = useState(defaultBudget);

      const store = { parts, setParts, members, setMembers, tasks, setTasks, comps, setComps, budget, setBudget };

      const lowStockCount = parts.filter(p => p.status === "Low Stock" || p.status === "Out of Stock").length;

      return (
        <div style={{ display: "flex", minHeight: "100vh", position: "relative" }}>
          <PCBBackground />
          <div style={{ position: "relative", zIndex: 1, display: "flex", width: "100%" }}>
            <Sidebar active={active} setActive={setActive} alertCount={lowStockCount} />
            <main style={{ flex: 1, height: "100vh", overflowY: "auto", position: "relative" }}>
              {active === "dashboard" && <Dashboard store={store} setActive={setActive} />}
              {active === "inventory" && <Inventory store={store} />}
              {active === "members" && <Members store={store} />}
              {active === "tasks" && <Tasks store={store} />}
              {active === "competitions" && <Competitions store={store} />}
              {active === "budget" && <Budget store={store} />}
            </main>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
